<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>You're offline — DJ Kuami Yoghurt</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #0a0a0a; color: #f5f5f5; }
    body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 1.5rem; box-sizing: border-box; }
    main { width: min(100%, 36rem); text-align: center; }
    h1 { color: #c9a84c; }
    p { color: #c5c5c5; line-height: 1.6; }
    a, button { display: inline-block; margin: .5rem; padding: .75rem 1rem; border: 1px solid #c9a84c; border-radius: .5rem; background: transparent; color: #f5f5f5; font: inherit; text-decoration: none; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>Reconnect to the internet to load music, videos, images, and booking information.</p>
    <a href="/">Try the home page</a>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
